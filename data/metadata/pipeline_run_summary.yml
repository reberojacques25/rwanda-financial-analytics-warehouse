known_limitations:
- Only 2 of 10 cataloged sources are automatically ingested (BNR interest rates, World
  Bank macro)
- BNR Financial Sector Statistics, MPFSS, NISR GDP, CPI, exchange rates require PDF/web
  extraction
- Bank-level disclosures (I&M, BK) require manual PDF extraction
- BNR XLS provides bimonthly/quarterly observations, not all 12 months - annual averages
  use available observations
- Annual averages for current year (2025) are based on Jan-Mar only
- BNR/NISR redistribution status unclear - raw data not committed to repository
- World Bank data is CC BY-4.0 but treated as VERIFIED_SECONDARY (may include estimates)
